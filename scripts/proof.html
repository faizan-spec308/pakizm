<style>
/* Layout: intro note + responsive gallery of isolated-instrument cutouts on white */
:root{ --bg:#eef1f3; --surface:#ffffff; --fg:#141a1d; --muted:#5b6b73; --border:#d4dade; --accent:#1f6b8c;

@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0e1316; --surface:#f3f5f6; --fg:#e6edf0; --muted:#8fa2ab; --border:#263036; --accent:#4fb3d9; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0e1316; --surface:#f3f5f6; --fg:#e6edf0; --muted:#8fa2ab; --border:#263036; --accent:#4fb3d9; color-scheme:dark; }
*{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--fg); font-family:var(--sans); line-height:1.5; }
.wrap{ max-width:1100px; margin:0 auto; padding-inline:16px; padding-block:24px 56px; }
h1{ font-size:1.35rem; font-weight:600; letter-spacing:-0.01em; margin:0 0 6px; }
.lede{ color:var(--muted); max-width:62ch; font-size:.95rem; }
.grid{ margin-top:22px; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; }
figure{ margin:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.imgbox{ width:100%; aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; background:#fff; border-radius:6px; overflow:hidden; }
.imgbox img{ max-width:100%; max-height:100%; object-fit:contain; }
figcaption{ font-family:var(--mono); font-size:.72rem; color:var(--muted); text-align:center; }
</style>
